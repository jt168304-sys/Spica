<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
  }
  canvas {
    background: transparent !important;
    display: block;
  }
  #diag {
    position: absolute; left: 4px; bottom: 4px; right: 4px;
    color: #a8c9bd; font-family: monospace; font-size: 10px;
    line-height: 1.3; pointer-events: none; z-index: 9998;
    text-shadow: 0 0 3px #000;
  }
  #erro-visivel {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    background: rgba(180, 0, 0, 0.85);
    color: #fff;
    font-family: monospace;
    font-size: 10px;
    padding: 4px;
    word-break: break-all;
    z-index: 9999;
  }
</style>
</head>
<body>
<div id="erro-visivel"></div>
<div id="diag"></div>
<canvas id="canvas"></canvas>

<script>
  function mostrarErro(msg) {
    var div = document.getElementById("erro-visivel");
    div.style.display = "block";
    div.textContent = (div.textContent ? div.textContent + " | " : "") + msg;
  }
  function resumo(e) { return String((e && (e.stack || e.message)) || e).split("\n").slice(0, 4).join(" | ").slice(0, 330); }
  var Q = new URLSearchParams(location.search);
  var OVERLAY = Q.get("overlay") === "1";      // dentro da bolha flutuante
  var DEBUG = !OVERLAY;                         // diagnóstico só na tela de teste   // false = esconde o diagnóstico (versão final)
  function diag(msg) {
    if (!DEBUG) return;
    var d = document.getElementById("diag");
    d.textContent += (d.textContent ? "\n" : "") + msg;
    d.style.whiteSpace = "pre-wrap";
  }
  window.addEventListener("unhandledrejection", function (e) {
    mostrarErro("Promise: " + resumo(e.reason));
  });
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      mostrarErro("Falha ao carregar: " + (e.target.src || e.target.href));
    } else {
      mostrarErro("Erro JS: " + (e.message || e));
    }
  }, true);
</script>

<!-- Cubism Core: PROPRIETÁRIO, baixe no site oficial da Live2D e coloque aqui como
     assets/live2d/live2dcubismcore.min.js (veja LEIA-ME_LIVE2D.md) -->
<script src="live2dcubismcore.min.js"></script>

<!-- PixiJS 6 e pixi-live2d-display (cubism4), agora HOSPEDADOS LOCAL em vez de CDN.
     Motivo: elimina de vez a dependência de internet no momento de abrir a bolha,
     e a variável "qual versão o CDN está servindo hoje" que já causou vários
     bugs diferentes nas últimas tentativas. Veja LEIA-ME_LIVE2D.md pra saber
     como baixar esses dois arquivos (curl direto no Termux). -->
<script src="vendor/pixi.min.js"></script>
<script src="vendor/cubism4.min.js"></script>

<script>
(function () {
  // ---------- diagnóstico inicial ----------
  var gl = null;
  try { var c = document.createElement("canvas"); gl = c.getContext("webgl") || c.getContext("experimental-webgl"); } catch (e) {}
  diag("WebGL: " + (gl ? "OK" : "NAO DISPONIVEL"));
  diag("Core: " + (typeof Live2DCubismCore !== "undefined" ? "OK" : "NAO"));
  diag("PIXI: " + (typeof PIXI !== "undefined" && PIXI.VERSION ? PIXI.VERSION : "NAO"));
  diag("live2d: " + (typeof PIXI !== "undefined" && PIXI.live2d ? "OK" : "NAO"));

  if (typeof Live2DCubismCore === "undefined") mostrarErro("Cubism Core NAO encontrado");
  if (typeof PIXI === "undefined" || typeof PIXI.Application !== "function") {
    mostrarErro("PIXI nao carregou corretamente"); return;
  }
  window.PIXI = window.PIXI || {};

  var app = new PIXI.Application({
    view: document.getElementById("canvas"),
    autoStart: true, backgroundAlpha: 0, resizeTo: window, antialias: true,
  });

  var model = null;

  // versão do arquivo .moc3 (byte 4) x versão máxima que o Core suporta
  try {
    var x = new XMLHttpRequest();
    x.open("GET", "osagegirl/osagegirl.moc3"); x.responseType = "arraybuffer";
    x.onload = function () {
      var b = new Uint8Array(x.response);
      var v = (typeof Live2DCubismCore !== "undefined" && Live2DCubismCore.Version) ? Live2DCubismCore.Version.csmGetLatestMocVersion() : "?";
      diag("moc3 v" + b[4] + " | core suporta ate v" + v + " | " + b.length + " bytes");
    };
    x.onerror = function () { diag("moc3: nao consegui ler (XHR)"); };
    x.send();
  } catch (e) { diag("moc3: " + resumo(e)); }

  // ---------- Core 6.x (Cubism 5.3) removeu drawables.renderOrders, que a biblioteca antiga usa ----------
  // Recria a ordem de desenho (posição de cada drawable) a partir de drawOrders.
  function consertarRenderOrders(cm) {
    var M = cm._model, dr = M.drawables;
    if (dr.renderOrders) return "nativo";
    var n = dr.count;
    cm.getDrawableRenderOrders = function () {
      var ro = (typeof M.getRenderOrders === "function") ? M.getRenderOrders() : null;
      if (ro && ro.length === n) return ro;
      var d = dr.drawOrders, idx = [], i;
      for (i = 0; i < n; i++) idx.push(i);
      idx.sort(function (a, b) { return ((d ? d[a] : a) - (d ? d[b] : b)) || (a - b); });
      var out = new Int32Array(n);
      for (i = 0; i < n; i++) out[idx[i]] = i;
      return out;
    };
    return "recriado a partir de " + (dr.drawOrders ? "drawOrders" : "indice");
  }

  // ---------- humores: parâmetros do rosto (suavizados) ----------
  // Param17..20 são as "expressões" do modelo (olhos >< / girando / sem brilho / pálida).
  var HUMORES = {
    neutro:   {},
    feliz:    { ParamEyeLSmile: 1, ParamEyeRSmile: 1, ParamMouthForm: 0.9, ParamCheek: 0.5, ParamBrowLY: 0.2, ParamBrowRY: 0.2 },
    surpresa: { Param17: 1, ParamBrowLY: 0.8, ParamBrowRY: 0.8 },
    confusa:  { Param18: 1, ParamAngleZ: 8 },
    triste:   { Param19: 1, ParamMouthForm: -0.7, ParamBrowLY: -0.4, ParamBrowRY: -0.4 },
    chocada:  { Param20: 1, ParamMouthForm: -0.4 }
  };
  var TODOS = ["ParamEyeLSmile","ParamEyeRSmile","ParamMouthForm","ParamCheek","ParamBrowLY","ParamBrowRY",
               "Param17","Param18","Param19","Param20","ParamAngleZ"];
  var alvo = {}, atual = {};
  TODOS.forEach(function (k) { alvo[k] = 0; atual[k] = 0; });

  var falando = false, boca = 0, t0 = performance.now();

  function aplicarFrame() {
    if (!model) return;
    var core = model.internalModel.coreModel;
    var t = (performance.now() - t0) / 1000;
    TODOS.forEach(function (k) {
      atual[k] += (alvo[k] - atual[k]) * 0.12;          // transição suave
      core.setParameterValueById(k, atual[k]);
    });
    // movimento sutil de cabeça/olhar (vida)
    core.addParameterValueById("ParamAngleX", 4 * Math.sin(t * 0.6));
    core.addParameterValueById("ParamAngleY", 2 * Math.sin(t * 0.4 + 1));
    core.addParameterValueById("ParamAngleZ", 1.5 * Math.sin(t * 0.5 + 2));
    // boca: oscila enquanto fala, fecha suave quando para
    var meta = falando ? 0.15 + 0.75 * Math.abs(Math.sin(t * 9)) * (0.6 + 0.4 * Math.sin(t * 2.3)) : 0;
    boca += (meta - boca) * 0.35;
    core.setParameterValueById("ParamMouthOpenY", boca);
  }

  // ---------- API usada pelo Python (evaluateJavascript) ----------
  window.SpicaLive2D = {
    carregar: function (modelUrl, tentativa) {
      tentativa = tentativa || 1;
      diag("modelo: carregando (tentativa " + tentativa + ")...");
      PIXI.live2d.Live2DModel.from(modelUrl).then(function (m) {
        model = m;
        diag("modelo: carregado");
        app.ticker.stop();                       // diagnóstico por fases, sem laço de erros
        try {
          var dr = model.internalModel.coreModel._model.drawables;
          var masc = 0; for (var i = 0; i < dr.maskCounts.length; i++) masc += dr.maskCounts[i];
          diag("mascaras: " + masc + " | texturas validas: " + model.textures.map(function (t) { return t.valid ? 1 : 0; }).join(","));
        } catch (e) { diag("info modelo: " + resumo(e)); }
        app.stage.addChild(model);
        SpicaLive2D._ajustarTamanho();
        try { model.internalModel.update(16); diag("fase update: OK"); }
        catch (e) { diag("fase update: ERRO " + resumo(e)); return; }
        try {
          diag("renderOrders: " + consertarRenderOrders(model.internalModel.coreModel));
          diag("metodos: " + Object.getOwnPropertyNames(Object.getPrototypeOf(model.internalModel.coreModel._model)).join(",").slice(0, 160));
        } catch (e) { diag("conserto: " + resumo(e)); }
        // --- sondas: o que está undefined dentro do desenho? ---
        try {
          var v = Live2DCubismCore.Version.csmGetVersion();
          diag("core " + (v >>> 24) + "." + ((v >>> 16) & 255) + "." + (v & 65535));
          var cm = model.internalModel.coreModel, rr = model.internalModel.renderer;
          diag("orders tipo: " + typeof cm.getDrawableRenderOrders() + " | dr: " + Object.keys(cm._model.drawables).join(",").slice(40, 190));
          diag("clipMgr: " + typeof rr._clippingManager + " | viewport: " + (app.renderer.gl.getParameter(app.renderer.gl.VIEWPORT) ? "ok" : "NULL"));
        } catch (e) { diag("sondas: " + resumo(e)); }
        try { app.renderer.render(app.stage); diag("fase render: OK"); }
        catch (e) { diag("fase render: ERRO " + resumo(e).slice(0, 120)); return; }
        model.internalModel.on("beforeModelUpdate", aplicarFrame);
        if (OVERLAY) app.ticker.maxFPS = 30;      // economiza bateria na bolha
        SpicaLive2D.setHumor(Q.get("humor") || "neutro");
        app.ticker.start();
        diag("rodando");
      }).catch(function (err) {
        diag("modelo: ERRO " + (err && err.message || err));
        if (tentativa < 3) {
          setTimeout(function () { SpicaLive2D.carregar(modelUrl, tentativa + 1); }, 500);
        } else {
          mostrarErro("Falha ao carregar modelo: " + (err && (err.stack || err.message) || err));
        }
      });
    },
    _ajustarTamanho: function () {
      if (!model) return;
      if (OVERLAY) {                 // enquadra o busto (rosto e tronco) na bolha
        var zoom = parseFloat(Q.get("zoom")) || 1.15, dy = parseFloat(Q.get("y"));
        if (isNaN(dy)) dy = 0.02;
        var esc2 = (app.renderer.width * zoom) / model.internalModel.originalWidth;
        model.anchor.set(0.5, 0);
        model.scale.set(esc2);
        model.position.set(app.renderer.width / 2, app.renderer.height * dy);
        return;
      }
      var escala = Math.min(app.renderer.width / model.internalModel.originalWidth,
                            app.renderer.height / model.internalModel.originalHeight) * 0.95;
      model.scale.set(escala);
      model.anchor.set(0.5, 0.5);
      model.position.set(app.renderer.width / 2, app.renderer.height / 2);
    },
    falarSimples: function (v) { falando = !!v; },
    setHumor: function (nome) {
      var def = HUMORES[nome] || HUMORES.neutro;
      TODOS.forEach(function (k) { alvo[k] = def[k] || 0; });
    }
  };

  window.addEventListener("resize", function () { SpicaLive2D._ajustarTamanho(); });

  function esperarPronto(n) {
    n = n || 0;
    if (typeof PIXI.live2d !== "undefined" && typeof Live2DCubismCore !== "undefined") {
      SpicaLive2D.carregar("osagegirl/osagegirl.model3.json");
      return;
    }
    if (n >= 40) { mostrarErro("Timeout esperando bibliotecas (PIXI/live2d/CubismCore)"); return; }
    setTimeout(function () { esperarPronto(n + 1); }, 250);
  }
  window.addEventListener("load", function () { esperarPronto(0); });
})();
</script>
</body>
</html>
