<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
  }
  canvas {
    background: transparent !important;
    display: block;
  }
  #erro-visivel {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0;
    background: rgba(180, 0, 0, 0.85);
    color: #fff;
    font-family: monospace;
    font-size: 10px;
    padding: 4px;
    word-break: break-all;
    z-index: 9999;
  }
</style>
</head>
<body>
<div id="erro-visivel"></div>
<canvas id="canvas"></canvas>

<script>
  // Registrado ANTES de qualquer script externo, pra pegar erro de
  // carregamento (ex: CDN fora do ar) dos próprios scripts abaixo — antes
  // esse listener só era criado depois deles, então não pegava nada.
  function mostrarErro(msg) {
    var div = document.getElementById("erro-visivel");
    div.style.display = "block";
    div.textContent = (div.textContent ? div.textContent + " | " : "") + msg;
  }
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      mostrarErro("Falha ao carregar: " + (e.target.src || e.target.href));
    } else {
      mostrarErro("Erro JS: " + (e.message || e));
    }
  }, true);
</script>

<!-- Cubism Core: PROPRIETÁRIO, baixe no site oficial da Live2D e coloque aqui como
     assets/live2d/live2dcubismcore.min.js (veja LEIA-ME_LIVE2D.md) -->
<script src="live2dcubismcore.min.js"></script>

<!-- PixiJS 6 e pixi-live2d-display (cubism4), carregados via CDN em runtime.
     IMPORTANTE: a partir da v6 do pixi.js, o bundle correto fica em
     dist/cjs/pixi.min.js — dist/pixi.min.js (sem "/cjs/") só existe até a v5
     e no cdnjs pode servir um arquivo incompleto, o que causava
     "PIXI.Application is not a constructor". -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.9/cjs/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

<script>
(function () {
  if (typeof Live2DCubismCore === "undefined") {
    mostrarErro("Cubism Core NAO encontrado (live2dcubismcore.min.js ausente ou nao carregou)");
  }
  if (typeof PIXI === "undefined" || typeof PIXI.Application !== "function") {
    mostrarErro("PIXI nao carregou corretamente (sem internet? CDN bloqueado?)");
  }

  window.PIXI = window.PIXI || {};

  var app = new PIXI.Application({
    view: document.getElementById("canvas"),
    autoStart: true,
    backgroundAlpha: 0,       // fundo transparente
    resizeTo: window,
    antialias: true,
  });

  var model = null;
  var mouthTimer = null;

  // ------- API exposta para o Python (via webview.evaluateJavascript) -------
  window.SpicaLive2D = {

    carregar: function (modelUrl) {
      if (!PIXI.live2d) {
        mostrarErro("pixi-live2d-display nao carregou (sem internet? CDN bloqueado?)");
        return;
      }
      PIXI.live2d.Live2DModel.from(modelUrl).then(function (m) {
        model = m;
        app.stage.addChild(model);
        SpicaLive2D._ajustarTamanho();
        // idle animation / respiração e física já rodam automaticamente
        // via pixi-live2d-display assim que o modelo é adicionado ao stage.
      }).catch(function (err) {
        mostrarErro("Falha ao carregar modelo: " + err);
      });
    },

    _ajustarTamanho: function () {
      if (!model) return;
      var escala = Math.min(
        app.renderer.width / model.internalModel.originalWidth,
        app.renderer.height / model.internalModel.originalHeight
      ) * 0.95;
      model.scale.set(escala);
      model.anchor.set(0.5, 0.5);
      model.position.set(app.renderer.width / 2, app.renderer.height / 2);
    },

    // valor de 0.0 (fechada) a 1.0 (aberta) — chamado a cada "tick" do lip-sync
    setBoca: function (valor) {
      if (!model) return;
      model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", valor);
    },

    // liga/desliga um ciclo automático simples de abre-fecha de boca
    // (fallback simplificado enquanto não há análise real de amplitude do áudio)
    falarSimples: function (falando) {
      if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
      if (!falando) { SpicaLive2D.setBoca(0); return; }
      var aberto = false;
      mouthTimer = setInterval(function () {
        aberto = !aberto;
        SpicaLive2D.setBoca(aberto ? 0.85 : 0.1);
      }, 120);
    },

    setExpressao: function (nome) {
      if (!model) return;
      model.expression(nome);
    },

    piscar: function () {
      // pixi-live2d-display já faz o EyeBlink automático via o grupo "EyeBlink"
      // do model3.json; método aqui reservado caso queira forçar manualmente.
    }
  };

  window.addEventListener("resize", function () {
    SpicaLive2D._ajustarTamanho();
  });

  // Carrega o modelo assim que os scripts externos terminarem
  window.addEventListener("load", function () {
    SpicaLive2D.carregar("osagegirl/osagegirl.model3.json");
  });
})();
</script>
</body>
</html>
