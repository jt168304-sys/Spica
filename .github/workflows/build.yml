name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: buildozer-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v5-

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip python3-pip \
            python3-setuptools autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev cython3

      - name: Install Buildozer
        run: |
          pip3 install --user "sh<2.0" buildozer==1.5.0 virtualenv Cython==0.29.33

      - name: Ensure Android SDK platform 33 is installed
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager

      - name: Prepare pinned p4a v2024.01.21 with archs.py fix
        run: |
          if [ ! -d "$HOME/p4a-src/.git" ]; then
            git clone --branch v2024.01.21 --single-branch --depth 1 https://github.com/kivy/python-for-android.git "$HOME/p4a-src"
          else
            git -C "$HOME/p4a-src" fetch origin v2024.01.21
            git -C "$HOME/p4a-src" checkout v2024.01.21
          fi
          python3 - "$HOME/p4a-src" <<'EOF'
import sys
path = sys.argv[1] + "/pythonforandroid/archs.py"
src = open(path, "r", encoding="utf-8").read()
old = ("            python_includes=join(\n"
"                self.ctx.get_python_install_dir(self.arch),\n"
"                'include/python{}'.format(self.ctx.python_recipe.version[0:3]),\n"
"            ),")
new = ("            python_includes=join(\n"
"                Recipe.get_recipe(\"python3\", self.ctx).include_root(self.arch)\n"
"            ),")
assert old in src, "archs.py pattern not found"
open(path, "w", encoding="utf-8").write(src.replace(old, new))
print("patched archs.py include path")
EOF

      - name: Build APK
        run: ~/.local/bin/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spica-debug-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: .buildozer/android/platform/build-arm64-v8a/dists/spica/build.log
          retention-days: 7
