name: Build Spica APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3-pip python3-setuptools libffi-dev libssl-dev libltdl-dev zlib1g-dev openjdk-17-jdk

      - name: Instalar Buildozer e Cython via PIP
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer cython

      - name: Compilar APK com Buildozer
        run: |
          buildozer android debug

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: Spica-debug-apk
          path: bin/*.apk
